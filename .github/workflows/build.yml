name: Build Templates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Build templates
      run: uv run python scripts/build.py

    - name: Check for uncommitted changes
      run: |
        if [ -n "$(git diff --name-only docs/)" ]; then
          echo "::error::docs/ is out of date. Run 'uv run python scripts/build.py' and commit the result."
          git diff --stat docs/
          exit 1
        fi
        echo "docs/ is up to date."
